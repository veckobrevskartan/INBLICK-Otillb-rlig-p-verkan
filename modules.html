<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>INBLICK — Den öppna attackytan · Moduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
:root{--bg:#0A1628;--bg-mid:#112040;--bg-surf:#162B52;--bg-card:#0E1E38;--text:#F0EDE6;--muted:#8A9AB0;--dim:#4A5A6A;--accent:#B8973A;--accent-d:#7A6325;--accent-g:rgba(184,151,58,.12);--green:#4A7B6F;--orange:#C45C2E;--purple:#9B4FBB;--border:rgba(184,151,58,.18);--border-s:rgba(240,237,230,.07);--fd:"Cormorant Garamond",Georgia,serif;--fb:"IBM Plex Sans",system-ui,sans-serif;--fm:"IBM Plex Mono",monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,transparent 0%,var(--accent) 10%,var(--accent) 90%,transparent 100%);z-index:300;pointer-events:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent-d);border-radius:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 52px}

/* ─── NAV (desktop + mobile) ─── */
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,22,40,.97);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-s)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:52px;max-width:1200px;margin:0 auto;padding:0 52px}
.nav-brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex-shrink:0}
.nav-ser{font-family:var(--fm);font-size:9px;color:var(--accent);letter-spacing:.2em;text-transform:uppercase}
.nav-name{font-family:var(--fd);font-size:18px;font-weight:500;color:var(--text)}
/* Desktop tabs — hidden on mobile */
.nav-tabs{display:flex;gap:1px;list-style:none;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tabs li a{font-family:var(--fm);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:6px 8px;white-space:nowrap;display:block;transition:.15s}
.nav-tabs li a:hover,.nav-tabs li a.active{background:var(--accent-g);color:var(--accent)}
/* Global search */
/* ── Kategori-navigation Förstå / Bedöma / Agera ── */
.cat-nav{display:flex;align-items:stretch;gap:0;height:52px;overflow:visible;position:relative}
.cat-group{position:relative;display:flex;align-items:center}
.cat-label{
  display:flex;align-items:center;gap:6px;
  font-family:var(--fm);font-size:8px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);cursor:pointer;padding:6px 14px;
  background:none;border:none;border-bottom:2px solid transparent;
  transition:.15s;white-space:nowrap;height:100%
}
.cat-label:hover{color:var(--accent);background:var(--accent-g)}
.cat-label.open{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-g)}
.cat-roman{font-family:var(--fd);font-size:11px;font-style:italic;opacity:.55;margin-right:2px}
.cat-chevron{font-size:10px;opacity:.4;margin-left:2px;transition:.2s}
.cat-label.open .cat-chevron{transform:rotate(90deg)}
.cat-tabs{
  display:none;position:absolute;top:52px;left:0;
  background:rgba(10,22,40,.97);backdrop-filter:blur(16px);
  border:1px solid var(--border);border-top:2px solid var(--accent);
  min-width:200px;list-style:none;padding:6px 0;z-index:300;
  box-shadow:0 12px 40px rgba(0,0,0,.5)
}
.cat-tabs.open{display:block}
.cat-tabs li a{
  display:block;padding:8px 18px;
  font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;transition:.12s;white-space:nowrap
}
.cat-tabs li a:hover,.cat-tabs li a.active{
  color:var(--accent);background:var(--accent-g);
  padding-left:22px
}
/* Mobile kategori-headers */
.mob-cat-hdr{
  font-family:var(--fd);font-size:13px;font-style:italic;
  color:var(--accent);padding:18px 0 6px;
  border-top:1px solid var(--border-s);margin-top:8px;
  letter-spacing:.02em
}
.mob-cat-hdr:first-child{border-top:none;margin-top:0;padding-top:6px}
.nav-search-wrap{position:relative;flex-shrink:0}
#globalSearchInput{background:var(--bg-card);border:1px solid var(--border-s);color:var(--text);font-family:var(--fb);font-size:12px;padding:5px 30px 5px 10px;width:180px;transition:.2s}
#globalSearchInput:focus{outline:none;border-color:var(--accent);width:240px}
#globalSearchInput::placeholder{color:var(--dim)}
.nav-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--dim);cursor:pointer;font-size:14px;line-height:1;display:none}
/* Hamburger */
.nav-hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:6px;background:none;border:none;flex-shrink:0}
.nav-hamburger span{display:block;width:20px;height:2px;background:var(--muted);transition:.25s}
.nav-hamburger.open span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.nav-hamburger.open span:nth-child(2){opacity:0}
.nav-hamburger.open span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}
/* Mobile drawer */
.mobile-drawer{display:none;position:fixed;top:52px;left:0;right:0;bottom:0;background:rgba(10,22,40,.98);backdrop-filter:blur(14px);z-index:190;overflow-y:auto;padding:16px 24px}
.mobile-drawer.open{display:block}
.mobile-tab-btn{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--border-s);cursor:pointer;font-size:14px;color:var(--muted);transition:.15s;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left}
.mobile-tab-btn.active{color:var(--accent)}
.mobile-tab-btn .mtb-num{font-family:var(--fm);font-size:9px;letter-spacing:.12em;color:var(--dim);min-width:24px}
.mobile-tab-btn.active .mtb-num{color:var(--accent)}
.nav-back-link{font-family:var(--fm);font-size:9px;letter-spacing:.12em;color:var(--muted);text-decoration:none;padding:6px 10px;border:1px solid var(--border-s);transition:.15s;flex-shrink:0}
.nav-back-link:hover{color:var(--accent);border-color:var(--accent)}
/* Search results dropdown */
#searchResults{position:fixed;top:52px;right:0;left:0;z-index:180;background:rgba(10,22,40,.98);backdrop-filter:blur(14px);border-bottom:1px solid var(--border-s);max-height:60vh;overflow-y:auto;display:none}
#searchResults.open{display:block}
.sr-group{padding:12px 52px 4px;font-family:var(--fm);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border-s)}
.sr-item{padding:11px 52px;border-bottom:1px solid var(--border-s);cursor:pointer;display:flex;align-items:flex-start;gap:14px;transition:.15s}
.sr-item:hover{background:var(--bg-mid)}
.sr-item-icon{font-family:var(--fm);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);min-width:60px;margin-top:2px}
.sr-item-title{font-size:13px;color:var(--text);line-height:1.3}
.sr-item-sub{font-family:var(--fm);font-size:8px;color:var(--muted);margin-top:2px;letter-spacing:.08em}
.sr-empty{padding:24px 52px;font-size:13px;color:var(--dim);font-style:italic}
@media(max-width:900px){
  .nav-tabs{display:none}
  .nav-hamburger{display:flex}
  .nav-inner{padding:0 16px;gap:12px}
  .nav-back-link{display:none}
  #globalSearchInput{width:140px}
  #globalSearchInput:focus{width:160px}
  .sr-group,.sr-item,.sr-empty{padding-left:20px;padding-right:20px}
  .wrap{padding:0 16px}
}

/* ─── MODULES ─── */
.module{display:none;min-height:100vh;padding-top:68px}
.module.active{display:block}
.sec-head{padding:48px 0 36px}
.eyebrow{font-family:var(--fm);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.sec-title{font-family:var(--fd);font-size:clamp(32px,4vw,56px);font-weight:300;line-height:1.06}
.sec-title em{font-style:italic;color:var(--accent)}
.sec-intro{font-size:14px;color:var(--muted);max-width:600px;line-height:1.75;margin-top:12px}
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:8px;letter-spacing:.14em;text-transform:uppercase;padding:3px 8px}
.bdot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.b-conf{background:rgba(74,123,111,.12);color:var(--green);border:1px solid rgba(74,123,111,.3)}.bdot-conf{background:var(--green)}
.b-ind{background:var(--accent-g);color:var(--accent);border:1px solid rgba(184,151,58,.3)}.bdot-ind{background:var(--accent)}
.b-ana{background:rgba(196,92,46,.1);color:var(--orange);border:1px solid rgba(196,92,46,.25)}.bdot-ana{background:var(--orange)}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
.reveal.visible{opacity:1;transform:none}

/* ─── SHARED COMPONENTS ─── */
.fb{font-family:var(--fm);font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;background:transparent;color:var(--muted);border:1px solid var(--border-s);cursor:pointer;transition:.15s;white-space:nowrap}
.fb:hover,.fb.active{background:var(--accent-g);color:var(--accent);border-color:rgba(184,151,58,.35)}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:16px}
.filter-sep{width:1px;height:16px;background:var(--border-s);margin:0 2px;flex-shrink:0}
.card-grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--border-s)}
.card-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--border-s)}
.card-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--border-s)}
@media(max-width:860px){.card-grid-3{grid-template-columns:1fr 1fr}.card-grid-4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.card-grid-2,.card-grid-3,.card-grid-4{grid-template-columns:1fr}}
.btn-g{font-family:var(--fb);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:8px 18px;background:transparent;color:var(--text);border:1px solid var(--border-s);cursor:pointer;transition:.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn-g:hover{border-color:var(--accent);color:var(--accent)}
.section-sep{height:1px;background:var(--border-s);margin:48px 0}

/* ─── CHAIN ─── */
.chain-layout{display:grid;grid-template-columns:260px 1fr;gap:2px;background:var(--border-s);margin-bottom:60px}
@media(max-width:760px){.chain-layout{grid-template-columns:1fr}}
.chain-nav-col{background:var(--bg-card)}
.cni{padding:14px 16px;border-bottom:1px solid var(--border-s);cursor:pointer;display:flex;align-items:flex-start;gap:10px;transition:.15s;border-left:3px solid transparent}
.cni:hover{background:var(--bg-mid)}.cni.active{background:var(--bg-mid);border-left-color:var(--accent)}.cni.danger.active{border-left-color:var(--orange)}
.cni-num{font-family:var(--fd);font-size:24px;font-weight:300;color:var(--dim);line-height:1;min-width:22px}
.cni.active .cni-num{color:var(--accent)}.cni.danger.active .cni-num{color:var(--orange)}
.cni-lbl{font-family:var(--fm);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.cni.active .cni-lbl{color:var(--accent)}.cni.danger.active .cni-lbl{color:var(--orange)}
.cni-title{font-size:12px;color:var(--text);line-height:1.3}
.chain-panel-col{background:var(--bg-mid);padding:36px}
@media(max-width:760px){.chain-panel-col{padding:20px}}
.chain-progress{display:flex;gap:3px;margin-bottom:22px;flex-wrap:wrap}
.cp-dot{width:28px;height:3px;background:var(--border-s);cursor:pointer;border-radius:1px;transition:.25s}
.cp-dot.done{background:var(--accent)}.cp-dot.danger-done{background:var(--orange)}
.cp-step-lbl{font-family:var(--fm);font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:5px}
.cp-title{font-family:var(--fd);font-size:clamp(22px,3vw,36px);font-weight:300;line-height:1.1;margin-bottom:13px}
.cp-lead{font-size:14px;color:var(--text);line-height:1.75;margin-bottom:20px}
.cp-perspectives{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:18px 0}
@media(max-width:600px){.cp-perspectives{grid-template-columns:1fr}}
.cp-persp{background:var(--bg-card);padding:15px 17px}
.cpp-lbl{font-family:var(--fm);font-size:8px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--border-s)}
.cpp-lbl.ang{color:var(--orange)}.cpp-lbl.med{color:var(--accent)}.cpp-lbl.org{color:var(--green)}
.cpp-txt{font-size:12px;color:var(--muted);line-height:1.65}
.cp-sigs{margin-top:18px;padding-top:14px;border-top:1px solid var(--border-s)}
.cp-sigs-lbl{font-family:var(--fm);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cp-sig{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--text);margin-bottom:7px;line-height:1.5}
.cp-sig::before{content:"◈";color:var(--accent);font-size:8px;flex-shrink:0}
.cp-linked-cases{margin-top:14px;padding-top:12px;border-top:1px solid var(--border-s);display:none}
.cp-case-ref{padding:9px 12px;background:var(--bg-card);border:1px solid var(--border-s);margin-bottom:5px;cursor:pointer;transition:.13s}
.cp-case-ref:hover{border-color:var(--accent)}
.cp-case-ref-t{font-size:12px;color:var(--text);margin-bottom:2px;line-height:1.3}
.cp-case-ref-m{font-family:var(--fm);font-size:8px;color:var(--muted)}

/* ─── MAP ─── */
#map-container{height:520px;background:var(--bg-card);border:1px solid var(--border-s)}
@media(max-width:600px){#map-container{height:380px}}
.map-stats{display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap}
.mstat-val{font-family:var(--fd);font-size:26px;font-weight:300;color:var(--accent);line-height:1}
.mstat-lab{font-family:var(--fm);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.map-legend{display:flex;flex-wrap:wrap;gap:12px;padding:9px 14px;background:var(--bg-card);border:1px solid var(--border-s);margin-top:8px}
.leg-item{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:8px;letter-spacing:.09em;color:var(--muted)}
.leg-dot{width:9px;height:9px;border-radius:50%}
.map-case-panel{margin-top:2px;background:var(--bg-card);border:1px solid var(--border);padding:22px 26px;display:none}
.map-case-panel.open{display:block}
.mcp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:9px}
.mcp-title{font-family:var(--fd);font-size:20px;font-weight:400;line-height:1.2}
.mcp-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;flex-shrink:0}
.mcp-badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}
.mcp-meta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border-s)}
.mcp-mi{font-family:var(--fm);font-size:8px;letter-spacing:.09em;color:var(--muted)}.mcp-mi span{color:var(--text)}
.mcp-summary{font-size:13px;color:var(--text);line-height:1.75;margin-bottom:11px}
.mcp-sources{display:flex;flex-wrap:wrap;gap:6px}
.src-link{text-decoration:none;cursor:pointer;transition:.12s}
.src-link:hover{opacity:.8;text-decoration:underline}
.src-tag{font-family:var(--fm);font-size:8px;padding:3px 7px;border:1px solid var(--border-s);color:var(--muted)}
.src-tag.court{border-color:rgba(74,123,111,.3);color:var(--green)}.src-tag.report{border-color:rgba(184,151,58,.25);color:var(--accent)}
.leaflet-container{background:#0A1628!important;font-family:var(--fb)!important}
.leaflet-popup-content-wrapper{background:var(--bg-surf)!important;border:1px solid var(--border)!important;border-radius:2px!important;box-shadow:0 10px 36px rgba(0,0,0,.6)!important;min-width:230px}
.leaflet-popup-tip{background:var(--bg-surf)!important}
.leaflet-popup-content{margin:12px 14px!important}
.pop-title{font-family:var(--fd);font-size:14px;font-weight:400;color:var(--text);mar
