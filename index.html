<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>INBLICK — Den öppna attackytan | Svensk OSINT</title>
<meta name="description" content="Ett encyklopediskt referensverk om otillbörlig påverkan mot svensk offentlig sektor. 115 dokumenterade fall och 14 analysmoduler. Strukturerat i tre delar: Förstå, Bedöma, Agera. Producerat av Svensk OSINT."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0A1628;--bg-mid:#112040;--bg-surf:#162B52;--bg-card:#0E1E38;
  --text:#F0EDE6;--muted:#8A9AB0;--dim:#4A5A6A;
  --accent:#B8973A;--accent-l:#CDA842;--accent-d:#7A6325;--accent-g:rgba(184,151,58,.12);
  --green:#4A7B6F;--orange:#C45C2E;--purple:#9B4FBB;
  --border:rgba(184,151,58,.16);--border-s:rgba(240,237,230,.07);
  --fd:"Cormorant Garamond",Georgia,serif;
  --fb:"IBM Plex Sans",system-ui,sans-serif;
  --fm:"IBM Plex Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,transparent 0%,var(--accent) 8%,var(--accent) 92%,transparent 100%);z-index:300;opacity:.8;pointer-events:none}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--accent-d);border-radius:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 52px}
@media(max-width:768px){.wrap{padding:0 22px}}
em{font-style:italic}
a{color:inherit}

/* ─── NAV ─── */
nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(10,22,40,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-s)}
.nav-i{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:1180px;margin:0 auto;padding:0 52px}
.nav-brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;flex-shrink:0}
.nav-ser{font-family:var(--fm);font-size:9px;color:var(--accent);letter-spacing:.2em;text-transform:uppercase}
.nav-name{font-family:var(--fd);font-size:19px;font-weight:500;color:var(--text);letter-spacing:.02em}
.nav-links{display:flex;gap:0;list-style:none;align-items:center}
.nav-links a{font-family:var(--fm);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:8px 13px;transition:.2s;position:relative}
.nav-links a:hover{color:var(--accent)}
.nav-links a .nl-rom{font-family:var(--fd);font-style:italic;font-size:12px;color:var(--accent);opacity:.6;margin-right:5px}
.nav-cta{font-family:var(--fm);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--accent);text-decoration:none;padding:8px 16px;transition:.2s;flex-shrink:0;margin-left:8px}
.nav-cta:hover{background:var(--accent-l)}
@media(max-width:900px){.nav-links{display:none}.nav-i{padding:0 22px}}

/* ─── HERO ─── */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:56px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;bottom:0;left:0;right:0;height:160px;background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:2}
.hero-bg{position:absolute;inset:0;opacity:.035;pointer-events:none}
.hero-bg-grid{width:100%;height:100%;background-image:linear-gradient(rgba(184,151,58,.4) 1px,transparent 1px),linear-gradient(90deg,rgba(184,151,58,.4) 1px,transparent 1px);background-size:72px 72px}
.hero-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:72px;align-items:center;position:relative;z-index:1;padding:72px 0}
@media(max-width:980px){.hero-layout{grid-template-columns:1fr;gap:48px;padding:56px 0}}
.hero-eyebrow{font-family:var(--fm);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hero-eyebrow::before{content:"";display:block;width:30px;height:1px;background:var(--accent)}
.hero-kicker{font-family:var(--fm);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.hero-title{font-family:var(--fd);font-size:clamp(46px,6.2vw,88px);font-weight:300;line-height:1.0;letter-spacing:-.02em;margin-bottom:20px}
.hero-title em{font-style:italic;color:var(--accent)}
.hero-sub{font-family:var(--fd);font-size:clamp(19px,2.3vw,27px);font-weight:300;color:var(--muted);line-height:1.4;margin-bottom:26px;font-style:italic}
.hero-lead{font-size:14px;color:var(--muted);line-height:1.8;max-width:490px;margin-bottom:34px}
.hero-lead strong{color:var(--text);font-weight:500}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:40px}
.btn-primary{display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:var(--bg);font-family:var(--fb);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:14px 26px;transition:.2s}
.btn-primary:hover{background:var(--accent-l);transform:translateY(-1px)}
.btn-ghost{display:inline-flex;align-items:center;gap:9px;background:transparent;color:var(--text);font-family:var(--fb);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:13px 26px;border:1px solid var(--border-s);transition:.2s}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.hero-meta{display:grid;grid-template-columns:repeat(4,auto);gap:30px;padding-top:30px;border-top:1px solid var(--border-s);justify-content:start}
@media(max-width:520px){.hero-meta{grid-template-columns:repeat(2,1fr);gap:24px}}
.hero-meta-item{display:flex;flex-direction:column;gap:4px}
.hero-meta-val{font-family:var(--fd);font-size:34px;font-weight:300;color:var(--accent);line-height:1}
.hero-meta-lab{font-family:var(--fm);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);line-height:1.3}

/* ─── CHAIN VIS (hero höger) ─── */
.chain-vis{position:relative}
.chain-vis-label{font-family:var(--fm);font-size:8px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:18px;padding-left:2px;display:flex;align-items:center;justify-content:space-between}
.chain-vis-label span:last-child{color:var(--dim)}
.chain-steps{display:flex;flex-direction:column;gap:2px}
.chain-step{display:flex;align-items:stretch;gap:0;opacity:0;animation:chainIn .5s ease forwards;text-decoration:none}
.chain-step:nth-child(1){animation-delay:.1s}.chain-step:nth-child(2){animation-delay:.22s}
.chain-step:nth-child(3){animation-delay:.34s}.chain-step:nth-child(4){animation-delay:.46s}
.chain-step:nth-child(5){animation-delay:.58s}.chain-step:nth-child(6){animation-delay:.7s}
.chain-step:nth-child(7){animation-delay:.82s}
@keyframes chainIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
.cs-num{font-family:var(--fm);font-size:10px;font-weight:500;color:var(--accent);padding:13px 9px;background:var(--bg-card);border-left:2px solid var(--accent);min-width:34px;display:flex;align-items:center;justify-content:center;letter-spacing:.06em;transition:.2s}
.chain-step:last-child .cs-num{border-left-color:var(--orange);color:var(--orange)}
.cs-body{flex:1;background:var(--bg-card);padding:13px 18px;border-bottom:1px solid var(--border-s);transition:.2s}
.chain-step:hover .cs-body{background:var(--bg-mid)}
.chain-step:hover .cs-num{background:var(--bg-mid)}
.cs-step-label{font-family:var(--fm);font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.chain-step:last-child .cs-step-label{color:var(--orange)}
.cs-title{font-size:13px;color:var(--text);font-weight:500;line-height:1.25}
.cs-lead{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}

/* ─── DIVIDER ─── */
.sdiv{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent)}

/* ─── THESIS-SEKTION (encyklopedisk positionering) ─── */
.thesis{padding:88px 0;background:var(--bg-mid);border-top:1px solid var(--border-s);border-bottom:1px solid var(--border-s)}
.thesis-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
@media(max-width:860px){.thesis-grid{grid-template-columns:1fr;gap:36px}}
.thesis-lead{font-family:var(--fd);font-size:clamp(26px,3.2vw,40px);font-weight:300;line-height:1.25;letter-spacing:-.01em}
.thesis-lead em{font-style:italic;color:var(--accent)}
.thesis-body{font-size:14.5px;color:var(--muted);line-height:1.85}
.thesis-body p{margin-bottom:18px}
.thesis-body p:last-child{margin-bottom:0}
.thesis-body strong{color:var(--text);font-weight:500}

/* ─── SECTION HEADERS ─── */
.section-eyebrow{font-family:var(--fm);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:14px;display:flex;align-items:center;gap:11px}
.section-eyebrow .se-rom{font-family:var(--fd);font-style:italic;font-size:15px;opacity:.7}
.section-title{font-family:var(--fd);font-size:clamp(32px,4vw,50px);font-weight:300;line-height:1.08;margin-bottom:16px;letter-spacing:-.01em}
.section-title em{font-style:italic;color:var(--accent)}
.section-intro{font-size:14px;color:var(--muted);max-width:600px;line-height:1.8}

/* ─── DE TRE DELARNA (Förstå/Bedöma/Agera) ─── */
.parts-section{padding:88px 0}
.parts-intro{margin-bottom:8px}
.part-block{margin-top:64px}
.part-block:first-of-type{margin-top:52px}
.part-head{display:flex;align-items:baseline;gap:20px;margin-bottom:6px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.part-roman{font-family:var(--fd);font-size:clamp(40px,5vw,64px);font-weight:300;font-style:italic;color:var(--accent);line-height:.9;flex-shrink:0}
.part-headtext{flex:1}
.part-name{font-family:var(--fd);font-size:clamp(26px,3vw,36px);font-weight:400;line-height:1.05;margin-bottom:4px}
.part-q{font-family:var(--fm);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.part-desc{font-size:13.5px;color:var(--muted);line-height:1.75;max-width:560px;margin:18px 0 26px}
.part-conf{font-family:var(--fm);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:26px;display:flex;align-items:center;gap:8px}
.part-conf::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* Modulkort i del */
.part-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--border-s)}
@media(max-width:860px){.part-cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.part-cards{grid-template-columns:1fr}}
.mcard{background:var(--bg-card);padding:26px 24px 22px;text-decoration:none;display:flex;flex-direction:column;gap:11px;transition:.2s;position:relative;border-top:2px solid transparent;min-height:180px}
.mcard:hover{background:var(--bg-mid)}
.mcard.is-new::after{content:"Ny";position:absolute;top:14px;right:16px;font-family:var(--fm);font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:2px 7px}
.mc-kicker{font-family:var(--fm);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mc-title{font-family:var(--fd);font-size:23px;font-weight:400;color:var(--text);line-height:1.08}
.mc-desc{font-size:12.5px;color:var(--muted);line-height:1.6;flex:1}
.mc-foot{font-family:var(--fm);font-size:8px;letter-spacing:.1em;text-transform:uppercase;margin-top:auto;padding-top:13px;border-top:1px solid var(--border-s);display:flex;align-items:center;justify-content:space-between}
.mc-arrow{font-size:12px;transition:.2s}
.mcard:hover .mc-arrow{transform:translateX(4px)}
.mc-conf{font-family:var(--fm);font-size:8px;letter-spacing:.08em;color:var(--dim);font-style:normal;text-transform:none;display:block;margin-top:9px;padding-top:9px;border-top:1px dotted var(--border-s);line-height:1.4}
.mc-conf b{color:var(--muted);font-weight:500}

/* ─── STATS BAR ─── */
.stats-bar{padding:0;background:var(--bg-mid);border-top:1px solid var(--border-s);border-bottom:1px solid var(--border-s)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-s)}
@media(max-width:760px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat-cell{background:var(--bg-mid);padding:34px 30px}
.stat-val{font-family:var(--fd);font-size:clamp(38px,4.6vw,56px);font-weight:300;color:var(--accent);line-height:1}
.stat-label{font-family:var(--fm);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--text);margin-top:8px;line-height:1.4}
.stat-note{font-size:11.5px;color:var(--dim);margin-top:8px;line-height:1.5}

/* ─── EVIDENCE ─── */
.evidence-section{padding:80px 0}
.evidence-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--border-s);margin-top:42px}
@media(max-width:680px){.evidence-grid{grid-template-columns:1fr}}
.ev-cell{background:var(--bg-card);padding:28px 26px}
.ev-badge{display:inline-flex;align-items:center;gap:7px;font-family:var(--fm);font-size:8px;letter-spacing:.15em;text-transform:uppercase;padding:4px 11px;margin-bottom:16px}
.ev-badge.conf{background:rgba(74,123,111,.12);color:var(--green);border:1px solid rgba(74,123,111,.3)}
.ev-badge.ind{background:var(--accent-g);color:var(--accent);border:1px solid rgba(184,151,58,.3)}
.ev-badge.ana{background:rgba(196,92,46,.1);color:var(--orange);border:1px solid rgba(196,92,46,.25)}
.ev-dot{width:6px;height:6px;border-radius:50%}
.ev-dot.conf{background:var(--green)}.ev-dot.ind{background:var(--accent)}.ev-dot.ana{background:var(--orange)}
.ev-count{font-family:var(--fd);font-size:30px;font-weight:300;color:var(--text);line-height:1;margin-bottom:10px}
.ev-count span{font-size:13px;color:var(--muted);font-family:var(--fm)}
.ev-title{font-family:var(--fd);font-size:19px;font-weight:400;margin-bottom:8px}
.ev-desc{font-size:12.5px;color:var(--muted);line-height:1.7}

/* ─── ACTORS ─── */
.actors-section{padding:80px 0;background:var(--bg-mid);border-top:1px solid var(--border-s)}
.actor-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--border-s);margin-top:42px}
@media(max-width:860px){.actor-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:540px){.actor-grid{grid-template-columns:1fr}}
.ap-card{background:var(--bg-card);padding:24px 22px;border-top:3px solid;text-decoration:none;display:block;transition:.2s}
.ap-card:hover{background:var(--bg-surf)}
.ap-name{font-family:var(--fd);font-size:21px;font-weight:400;margin-bottom:5px}
.ap-sub{font-family:var(--fm);font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.ap-goal{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.ap-horizon{font-family:var(--fm);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.ap-cases{font-family:var(--fm);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding-top:13px;border-top:1px solid var(--border-s)}

/* ─── CASE PREVIEW ─── */
.cases-section{padding:80px 0}
.case-list{display:flex;flex-direction:column;gap:1px;background:var(--border-s);margin-top:42px}
.cp-row{background:var(--bg-card);padding:17px 24px;display:flex;align-items:center;gap:20px;text-decoration:none;transition:.15s;border-left:3px solid transparent}
.cp-row:hover{background:var(--bg-surf);border-left-color:var(--accent)}
.cp-status{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cp-status.conf{background:var(--green)}.cp-status.ind{background:var(--accent)}
.cp-tcell{flex:1;min-width:0}
.cp-title{font-size:13px;color:var(--text);margin-bottom:3px;line-height:1.3}
.cp-meta{font-family:var(--fm);font-size:8px;letter-spacing:.06em;color:var(--muted)}
.cp-sector{font-family:var(--fm);font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border-s);color:var(--dim);flex-shrink:0;white-space
