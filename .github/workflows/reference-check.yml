name: Kontrollera referenser

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera struktur och förbjudna landningssidor
        run: node scripts/validate-references.mjs

      - name: Kontrollera HTTP-status för fallkällor
        run: node scripts/audit-live-links.mjs --fast
