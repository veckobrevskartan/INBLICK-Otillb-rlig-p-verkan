name: Kontrollera referenser

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera struktur och förbjudna landningssidor
        run: node scripts/validate-references.mjs

      - name: Kontrollera HTTP-status för fallkällor
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 3
            --timeout 30
            --accept 200,204,206,401,403,429
            cases.json
          fail: true
