name: OSINT site maintenance

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply requested site changes
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          modules_path = Path('modules.html')
          index = index_path.read_text(encoding='utf-8')
          modules = modules_path.read_text(encoding='utf-8')
          log = []

          def note(msg):
              log.append(msg)
              print(msg)

          def replace_once(text, old, new, label):
              if new in text:
                  note(f'OK already: {label}')
                  return text
              if old in text:
                  note(f'OK changed: {label}')
                  return text.replace(old, new, 1)
              note(f'MISS: {label}')
              return text

          def extract_balanced_div(text, start):
              token_re = re.compile(r'<div\b[^>]*>|</div>', re.I)
              depth = 0
              for m in token_re.finditer(text, start):
                  token = m.group(0).lower()
                  if token.startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return m.end()
              return None

          def move_li_after(text, item_marker, target_marker, label, limit=None):
              scope_end = len(text) if limit is None else limit
              item_pos = text.find(item_marker, 0, scope_end)
              target_pos = text.find(target_marker, 0, scope_end)
              if item_pos < 0 or target_pos < 0:
                  note(f'MISS: {label} markers')
                  return text
              item_start = text.rfind('<li', 0, item_pos)
              item_end = text.find('</li>', item_pos)
              target_end = text.find('</li>', target_pos)
              if min(item_start, item_end, target_end) < 0:
                  note(f'MISS: {label} boundaries')
                  return text
              item_end += len('</li>')
              target_end += len('</li>')
              if item_start > target_end and item_start - target_end < 120:
                  note(f'OK already: {label}')
                  return text
              item = text[item_start:item_end]
              text = text[:item_start] + text[item_end:]
              target_pos = text.find(target_marker, 0, scope_end)
              target_end = text.find('</li>', target_pos) + len('</li>')
              text = text[:target_end] + '\n          ' + item.strip() + text[target_end:]
              note(f'OK moved: {label}')
              return text

          def move_button_after(text, item_id, target_id, label):
              item_pos = text.find(item_id)
              target_pos = text.find(target_id)
              if item_pos < 0 or target_pos < 0:
                  note(f'MISS: {label} markers')
                  return text
              item_start = text.rfind('<button', 0, item_pos)
              item_end = text.find('</button>', item_pos)
              target_end = text.find('</button>', target_pos)
              if min(item_start, item_end, target_end) < 0:
                  note(f'MISS: {label} boundaries')
                  return text
              item_end += len('</button>')
              target_end += len('</button>')
              if item_start > target_end and item_start - target_end < 180:
                  note(f'OK already: {label}')
                  return text
              item = text[item_start:item_end]
              text = text[:item_start] + text[item_end:]
              target_pos = text.find(target_id)
              target_end = text.find('</button>', target_pos) + len('</button>')
              text = text[:target_end] + '\n      ' + item.strip() + text[target_end:]
              note(f'OK moved: {label}')
              return text

          # ============================================================
          # INDEX / startsida
          # ============================================================

          css_marker = '.nav-group{position:relative;display:flex;align-items:stretch}'
          css_add = css_marker + '\n.nav-links>li:not(.nav-group){display:flex;align-items:stretch}\n.nav-source{height:100%;align-items:center}'
          index = replace_once(index, css_marker, css_add, 'Källor aligned vertically on homepage')
          index = replace_once(index, '.nav-source{padding:16px 0}', '.nav-source{padding:16px 0;height:auto}', 'mobile Källor height reset')

          nav_end = index.find('</nav>')
          index = move_li_after(index, 'modules.html#mod-visuals', 'modules.html#mod-theory', 'Visuella modeller to Förstå in homepage nav', nav_end if nav_end > 0 else None)

          old_hero = '.hero-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:72px;align-items:center;position:relative;z-index:1;padding:72px 0}'
          new_hero = '.hero-layout{display:grid;grid-template-columns:1fr;max-width:900px;gap:0;align-items:center;position:relative;z-index:1;padding:72px 0}'
          index = replace_once(index, old_hero, new_hero, 'one-column homepage hero')
          index = replace_once(index, '.chain-vis{position:relative}', '.chain-vis{display:none!important}', 'hide Påverkanskedjan from homepage hero')

          map_cta = '<a href="modules.html#mod-map" class="btn-ghost">Se händelsekartan</a>'
          org_cta = '<a href="organisationstest.html" class="btn-ghost">Gör organisationstestet</a>'
          if org_cta not in index:
              if map_cta in index:
                  index = index.replace(map_cta, map_cta + '\n          ' + org_cta, 1)
                  note('OK changed: added organisationstest CTA')
              else:
                  note('MISS: homepage map CTA')
          else:
              note('OK already: organisationstest CTA')

          # Move the visual-model card immediately after the theory card.
          visual_card_re = re.compile(r'\s*<a href="modules\.html#mod-visuals" class="mcard"[^>]*>.*?</a>', re.S)
          theory_card_re = re.compile(r'<a href="modules\.html#mod-theory" class="mcard"[^>]*>.*?</a>', re.S)
          vm = visual_card_re.search(index)
          tm = theory_card_re.search(index)
          if vm and tm:
              if vm.start() > tm.end() and vm.start() - tm.end() < 300:
                  note('OK already: visual model card in Förstå')
              else:
                  card = vm.group(0).strip()
                  index = index[:vm.start()] + index[vm.end():]
                  tm = theory_card_re.search(index)
                  if tm:
                      index = index[:tm.end()] + '\n        ' + card + index[tm.end():]
                      note('OK moved: visual model card to Förstå')
                  else:
                      note('MISS after removal: theory card')
          else:
              note('MISS: homepage visual/theory card')

          # Add Botkyrka to the curated front-page cases, without changing the case count.
          bot_title = 'Botkyrka — misstänkta oegentligheter granskas av infiltrationskommission'
          if bot_title not in index:
              target = '<div class="cp-title">Norrtäljeanstalten — kriminalvårdare smugglade mobiler till gängledare, åtta dömda</div>'
              tpos = index.find(target)
              if tpos >= 0:
                  row_start = index.rfind('<a href="modules.html#mod-map" class="cp-row">', 0, tpos)
                  if row_start >= 0:
                      bot_row = '''<a href="modules.html#mod-map" class="cp-row">
                  <div class="cp-status ind"></div>
                  <div class="cp-tcell">
                    <div class="cp-title">Botkyrka — misstänkta oegentligheter granskas av infiltrationskommission</div>
                    <div class="cp-meta">Botkyrka · Indikation · Kaliber 15–16 juni 2026 · Regeringen 26 juni 2026</div>
                  </div>
                  <div class="cp-sector">Kommun/politik</div>
                  <div class="cp-year">2026</div>
                </a>
                '''
                      index = index[:row_start] + bot_row + index[row_start:]
                      note('OK changed: surfaced Botkyrka case on homepage')
                  else:
                      note('MISS: homepage case row boundary')
              else:
                  note('MISS: Norrtälje homepage case target')
          else:
              note('OK already: Botkyrka homepage case')

          old_stat = '<div class="stat-note"><a href="https://polisen.se/siteassets/dokument/regeringsuppdrag/lagesbild-over-aktiva-gangkriminella-i-sverige-.pdf/download/?v=f8edd8d100b188a6937b44efc91a30ea" target="_blank" rel="noopener">Polismyndighetens lägesbild 2024</a> — kategoriserade som möjliggörare bland aktiva i kriminella nätverk</div>'
          new_stat = '<div class="stat-note"><a href="https://polisen.se/siteassets/dokument/regeringsuppdrag/lagesbild-over-aktiva-gangkriminella-i-sverige-.pdf/download/?v=f8edd8d100b188a6937b44efc91a30ea" target="_blank" rel="noopener">Polismyndighetens lägesbild 2024</a> — senaste publicerade kvantifieringen av just kategorin möjliggörare. <a href="https://polisen.se/siteassets/dokument/organiserad_brottslighet/myndighetsgemensam-lagesbild---organiserad-brottslighet-2025.pdf" target="_blank" rel="noopener">MGL 2025</a> ger den nyare samlade hotbilden för möjliggörare, korruption och otillåten påverkan.</div>'
          index = replace_once(index, old_stat, new_stat, 'clarify 680 as 2024 metric and link MGL 2025')

          # ============================================================
          # MODULES / verket
          # ============================================================

          css_marker = '.nav-group{position:relative;display:flex;align-items:stretch}'
          css_add = css_marker + '\n.nav-links>li:not(.nav-group){display:flex;align-items:stretch}\n.nav-source{height:100%;align-items:center}'
          modules = replace_once(modules, css_marker, css_add, 'Källor aligned vertically in modules')
          modules = replace_once(modules, '.nav-source{padding:16px 0}', '.nav-source{padding:16px 0;height:auto}', 'mobile Källor height reset in modules')

          # Remove the repeated full source footer, but retain the dedicated mod-sources catalogue.
          source_section = modules.find('<section id="mod-sources"')
          footer_tag = modules.rfind('<footer id="kallforteckning"', 0, source_section if source_section >= 0 else len(modules))
          if footer_tag >= 0:
              footer_end = modules.find('</footer>', footer_tag)
              if footer_end >= 0:
                  start = footer_tag
                  comment_start = modules.rfind('<!--', max(0, footer_tag - 350), footer_tag)
                  comment_end = modules.find('-->', comment_start) if comment_start >= 0 else -1
                  if comment_start >= 0 and comment_end >= 0 and comment_end < footer_tag:
                      comment_text = modules[comment_start:comment_end+3]
                      if 'KÄLL' in comment_text.upper() or 'SIDFOT' in comment_text.upper():
                          start = comment_start
                  modules = modules[:start] + '<!-- Fullständig källkatalog finns i mod-sources. -->\n' + modules[footer_end + len('</footer>'):]
                  note('OK changed: removed repeated Primärkällor/fallreferenser footer')
              else:
                  note('MISS: repeated footer closing tag')
          else:
              note('OK already/MISS: no repeated source footer before mod-sources')

          # Move Visuella modeller from Agera to Förstå in desktop SPA category tabs.
          first_section = modules.find('<section')
          modules = move_li_after(modules, 'id="tab-visuals"', 'id="tab-theory"', 'Visuella modeller to Förstå in modules tabs', first_section if first_section > 0 else None)

          # Move corresponding mobile tab and renumber mobile tab labels in document order.
          modules = move_button_after(modules, 'id="mtab-visuals"', 'id="mtab-theory"', 'Visuella modeller mobile tab to Förstå')
          nums = list(re.finditer(r'<span class="mtb-num">\d+</span>', modules))
          if len(nums) == 14:
              pieces = []
              last = 0
              for i, m in enumerate(nums, 1):
                  pieces.append(modules[last:m.start()])
                  pieces.append(f'<span class="mtb-num">{i:02d}</span>')
                  last = m.end()
              pieces.append(modules[last:])
              modules = ''.join(pieces)
              note('OK changed: renumbered 14 mobile module tabs')
          else:
              note(f'INFO: mobile tab number markers = {len(nums)}; renumber skipped')

          # Correct the MGL publication cadence in organisationstest explanation if present here.
          old_hint = 'Myndighetsgemensam lägesbild om organiserad brottslighet publiceras årligen. Organisationer som inte aktivt konsumerar omvärldsbevakning saknar grundförutsättningen för adekvat riskbedömning.'
          new_hint = 'Den myndighetsgemensamma lägesbilden om organiserad brottslighet tas fram vartannat år; den senaste är MGL 2025. Den årliga rapporten Myndigheter i samverkan mot den organiserade brottsligheten redovisar det myndighetsgemensamma arbetet för föregående år. Organisationer som inte aktivt använder extern hotbildsinformation saknar en viktig grund för en aktuell riskbedömning.'
          modules = replace_once(modules, old_hint, new_hint, 'correct MGL cadence')

          # Update the prominent overview link from the 2024 annual cross-agency report to 2025.
          old_overview = '''<a href="https://www.ekobrottsmyndigheten.se/wp-content/uploads/2025/04/rapport-organiseradbrottslighet-2024.pdf" target="_blank" rel="noopener" style="display:flex;align-items:flex-start;gap:9px;padding:10px 13px;background:var(--bg-mid);border:1px solid var(--border-s);text-decoration:none;transition:.15s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border-s)'">
                  <span style="font-family:var(--fm);font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex-shrink:0;margin-top:1px">Rapport</span>
                  <span style="font-family:var(--fm);font-size:9px;color:var(--muted);line-height:1.4">Ekobrottsmyndigheten — Myndigheter mot organiserad brottslighet 2024 (PDF)</span>
                </a>'''
          new_overview = '''<a href="https://polisen.se/8e4d12f09a3e80cc10e4416846bd947a/siteassets/dokument/organiserad_brottslighet/rapport_organiseradbrottslighet_2025.pdf" target="_blank" rel="noopener" style="display:flex;align-items:flex-start;gap:9px;padding:10px 13px;background:var(--bg-mid);border:1px solid var(--border-s);text-decoration:none;transition:.15s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border-s)'">
                  <span style="font-family:var(--fm);font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);flex-shrink:0;margin-top:1px">Rapport</span>
                  <span style="font-family:var(--fm);font-size:9px;color:var(--muted);line-height:1.4">Polismyndigheten — Myndigheter i samverkan mot den organiserade brottsligheten 2025 (PDF)</span>
                </a>'''
          modules = replace_once(modules, old_overview, new_overview, 'overview annual report 2024 → 2025')

          # Enrich the existing cautious Botkyrka case with the reporting that prompted renewed scrutiny.
          cstart = modules.find('"id":"c133"')
          cend = modules.find('},{"id":"c134"', cstart) if cstart >= 0 else -1
          kaliber1 = 'https://www.sverigesradio.se/avsnitt/socialdemokraterna-gangen-och-maktskiftet-i-botkyrka-del-1-2'
          if cstart >= 0 and cend >= 0:
              chunk = modules[cstart:cend]
              if kaliber1 not in chunk:
                  gov = '{"l":"Regeringen — infiltrationskommission mot otillåten påverkan, Dir. 2026:63 (26 juni 2026)","t":"report","url":"https://www.regeringen.se/pressmeddelanden/2026/06/regeringen-tillsatter-en-infiltrationskommission-mot-otillaten-paverkan/"}'
                  extra = gov + ',{"l":"Sveriges Radio Kaliber — Socialdemokraterna, gängen och maktskiftet i Botkyrka, del 1/2 (15 juni 2026)","t":"media","url":"https://www.sverigesradio.se/avsnitt/socialdemokraterna-gangen-och-maktskiftet-i-botkyrka-del-1-2"},{"l":"Sveriges Radio Kaliber — Socialdemokraterna, gängen och maktskiftet i Botkyrka, del 2/2 (15 juni 2026)","t":"media","url":"https://www.sverigesradio.se/avsnitt/socialdemokraterna-gangen-och-maktskiftet-i-botkyrka-del-2-2"},{"l":"Sveriges Radio — ytterligare kriminell i S-uppgörelsen i Botkyrka 2023 (15 juni 2026)","t":"media","url":"https://www.sverigesradio.se/artikel/kaliber-avslojar-ytterligare-kriminell-i-s-uppgorelsen-i-botkyrka-2023"}'
                  if gov in chunk:
                      chunk = chunk.replace(gov, extra, 1)
                      modules = modules[:cstart] + chunk + modules[cend:]
                      note('OK changed: added Kaliber/SR sources to c133 Botkyrka')
                  else:
                      note('MISS: c133 government source exact string')
              else:
                  note('OK already: c133 has Kaliber sources')
          else:
              note('MISS: c133 case boundaries')

          # Dedicated source catalogue.
          source_section = modules.find('<section id="mod-sources"')
          if source_section >= 0:
              source_end = modules.find('</section>', source_section)
              if source_end < 0:
                  source_end = len(modules)
              source_text = modules[source_section:source_end]
              filter_pos = source_text.find("filterSrc('all')")

              # Remove only the featured MCF card before the filters.
              mcf_title = 'MCF — Vägledning Transportskydd (MCF0079, mars 2026) ↗'
              mcf_pos = source_text.find(mcf_title, 0, filter_pos if filter_pos >= 0 else len(source_text))
              if mcf_pos >= 0:
                  featured_start = source_text.rfind('<div style="padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--accent)">', 0, mcf_pos)
                  if featured_start >= 0:
                      featured_end = extract_balanced_div(source_text, featured_start)
                      if featured_end:
                          source_text = source_text[:featured_start] + source_text[featured_end:]
                          note('OK changed: de-featured MCF Transportskydd')
                      else:
                          note('MISS: balanced end of featured MCF card')
                  else:
                      note('MISS: featured MCF card start')
              else:
                  note('OK already/MISS: featured MCF card not found')

              # Add new/current primary sources as ordinary rows to existing authority-report category.
              group_marker = 'data-cat="myndighetsrapporter-och-lagstiftning"'
              gpos = source_text.find(group_marker)
              if gpos >= 0:
                  grid_pos = source_text.find('<div style="display:grid;gap:4px">', gpos)
                  if grid_pos >= 0:
                      insert_pos = grid_pos + len('<div style="display:grid;gap:4px">')
                      ordinary = [
                        ('current-mgl-2025','🏛','https://polisen.se/siteassets/dokument/organiserad_brottslighet/myndighetsgemensam-lagesbild---organiserad-brottslighet-2025.pdf','Polismyndigheten. Myndighetsgemensam lägesbild – organiserad brottslighet 2025.'),
                        ('current-myobs-2025','🏛','https://polisen.se/8e4d12f09a3e80cc10e4416846bd947a/siteassets/dokument/organiserad_brottslighet/rapport_organiseradbrottslighet_2025.pdf','Polismyndigheten. Myndigheter i samverkan mot den organiserade brottsligheten 2025.'),
                        ('current-gang-2025','🏛','https://polisen.se/siteassets/dokument/regeringsuppdrag/regeringsuppdrag-2025-lagesbild-over-aktiva-gangkriminella-i-sverige.pdf/download/','Polismyndigheten. Lägesbild över aktiva gängkriminella i Sverige, regeringsuppdrag 2025.'),
                        ('current-corruption-2025','🏛','https://polisen.se/siteassets/dokument/organiserad_brottslighet/rapport_korruption-i-sverige-2025.pdf/download/?v=4d2a5950d779836a69499efa161273cd','Polismyndigheten/NKIG. Korruption i Sverige – lägesbild 2025.'),
                        ('current-infiltration-commission','🏛','https://www.regeringen.se/pressmeddelanden/2026/06/regeringen-tillsatter-en-infiltrationskommission-mot-otillaten-paverkan/','Regeringen. Infiltrationskommission mot otillåten påverkan, Dir. 2026:63 (2026).'),
                        ('current-bra-statskontoret-2026','🏛','https://bra.se/rapporter/arkiv/2026-05-29-stod-for-arbetet-mot-otillaten-paverkan-i-den-offentliga-forvaltningen','Brå och Statskontoret. Stöd för arbetet mot otillåten påverkan i den offentliga förvaltningen (2026).'),
                      ]
                      rows = []
                      added = 0
                      for marker, icon, url, label in ordinary:
                          if f'data-added="{marker}"' not in source_text and url not in source_text[gpos:source_text.find('</div>\n  </div>', grid_pos)+len('</div>\n  </div>') if source_text.find('</div>\n  </div>', grid_pos)>=0 else len(source_text)]:
                              rows.append(f'''\n      <a data-added="{marker}" href="{url}" target="_blank" rel="noopener" title="{label}" style="display:flex;align-items:flex-start;gap:10px;padding:7px 10px;text-decoration:none;border:1px solid transparent;border-radius:2px;transition:.15s" onmouseover="this.style.borderColor='#3A5A3A30';this.style.background='var(--bg-card)'" onmouseout="this.style.borderColor='transparent';this.style.background='transparent'"><span style="font-size:11px;margin-top:1px;flex-shrink:0">{icon}</span><span style="font-family:var(--fm);font-size:12px;color:var(--text);line-height:1.5">{label}</span></a>''')
                              added += 1
                      if rows:
                          source_text = source_text[:insert_pos] + ''.join(rows) + source_text[insert_pos:]
                          note(f'OK changed: added {added} current authority sources to ordinary catalogue')
                      else:
                          note('OK already: current authority sources in ordinary catalogue')
                  else:
                      note('MISS: authority source group grid')
              else:
                  note('MISS: authority source group')

              # Add MCF as an ordinary source under sabotage/critical infrastructure.
              mcf_marker = 'data-added="mcf-transport-ordinary"'
              if mcf_marker not in source_text:
                  mg = source_text.find('data-cat="sabotage-och-kritisk-infrastruktur"')
                  if mg >= 0:
                      grid_pos = source_text.find('<div style="display:grid;gap:4px">', mg)
                      if grid_pos >= 0:
                          insert_pos = grid_pos + len('<div style="display:grid;gap:4px">')
                          row = '''\n      <a data-added="mcf-transport-ordinary" href="https://www.mcf.se/sv/amnesomraden/skydd-mot-olyckor-och-farliga-amnen/farligt-gods/transportskydd/" target="_blank" rel="noopener" title="Myndigheten för civilt försvar. Vägledning Transportskydd (MCF0079, mars 2026)." style="display:flex;align-items:flex-start;gap:10px;padding:7px 10px;text-decoration:none;border:1px solid transparent;border-radius:2px;transition:.15s" onmouseover="this.style.borderColor='#5A3A2E30';this.style.background='var(--bg-card)'" onmouseout="this.style.borderColor='transparent';this.style.background='transparent'"><span style="font-size:11px;margin-top:1px;flex-shrink:0">🏛</span><span style="font-family:var(--fm);font-size:12px;color:var(--text);line-height:1.5">Myndigheten för civilt försvar. Vägledning Transportskydd (MCF0079, mars 2026).</span></a>'''
                          source_text = source_text[:insert_pos] + row + source_text[insert_pos:]
                          note('OK changed: moved MCF into ordinary source catalogue')
                      else:
                          note('MISS: sabotage source group grid')
                  else:
                      note('MISS: sabotage source group')
              else:
                  note('OK already: ordinary MCF catalogue entry')

              modules = modules[:source_section] + source_text + modules[source_end:]
          else:
              note('MISS: dedicated mod-sources section')

          # Clean visible editorial revision text if any remains in the now-canonical source module.
          if 'Källförteckning · Reviderad augusti 2026' in modules:
              modules = modules.replace('Källförteckning · Reviderad augusti 2026', 'Källförteckning')
              note('OK changed: removed visible revision date label')

          index_path.write_text(index, encoding='utf-8')
          modules_path.write_text(modules, encoding='utf-8')
          Path('site-maintenance-result.txt').write_text('\n'.join(log) + '\n', encoding='utf-8')

      - name: Validate references without blocking patch
        shell: bash
        run: |
          set +e
          node scripts/validate-references.mjs > site-maintenance-validation.txt 2>&1
          code=$?
          echo "validator_exit=$code" >> site-maintenance-result.txt
          cat site-maintenance-validation.txt >> site-maintenance-result.txt
          exit 0

      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html modules.html site-maintenance-result.txt site-maintenance-validation.txt
          git commit -m "feat: simplify sources and refresh OSINT navigation" || exit 0
          git push
