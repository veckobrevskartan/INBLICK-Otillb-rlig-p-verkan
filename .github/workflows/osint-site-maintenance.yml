name: OSINT site maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osint-site-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested site changes
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          modules_path = Path('modules.html')
          index = index_path.read_text(encoding='utf-8')
          modules = modules_path.read_text(encoding='utf-8')
          log = []

          def note(msg):
              log.append(msg)
              print(msg)

          def align_source_nav(text, label):
              marker = '.nav-group{position:relative;display:flex;align-items:stretch}'
              extra = '\n.nav-links>li:not(.nav-group){display:flex;align-items:stretch}\n.nav-source{height:100%;align-items:center}'
              if '.nav-links>li:not(.nav-group){display:flex;align-items:stretch}' not in text:
                  if marker not in text:
                      raise RuntimeError(f'{label}: nav-group CSS marker missing')
                  text = text.replace(marker, marker + extra, 1)
                  note(f'{label}: aligned Källor with navigation row')
              text = text.replace('.nav-source{padding:16px 0}', '.nav-source{padding:16px 0;height:auto}', 1)
              return text

          def move_visual_nav(text, label):
              end = text.find('</nav>')
              if end < 0:
                  raise RuntimeError(f'{label}: nav end missing')
              nav = text[:end]
              rest = text[end:]
              vis_pat = re.compile(r'\s*<li><a href="(?:modules\.html)?#mod-visuals"[^>]*>Visuella modeller</a></li>')
              vis = list(vis_pat.finditer(nav))
              theory_pat = re.compile(r'(<li><a href="(?:modules\.html)?#mod-theory"[^>]*>Teorier och modeller</a></li>)')
              theory = list(theory_pat.finditer(nav))
              if len(vis) != 1 or len(theory) != 1:
                  raise RuntimeError(f'{label}: expected one visual nav item and one theory item, got {len(vis)}/{len(theory)}')
              item = vis[0].group(0).strip()
              nav = nav[:vis[0].start()] + nav[vis[0].end():]
              nav, n = theory_pat.subn(r'\1\n          ' + item, nav, count=1)
              if n != 1:
                  raise RuntimeError(f'{label}: failed to move visual nav item')
              note(f'{label}: moved Visuella modeller from Agera to Förstå after Teorier och modeller')
              return nav + rest

          # ---------- INDEX ----------
          index = align_source_nav(index, 'index')
          index = move_visual_nav(index, 'index')

          old_layout = '.hero-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:72px;align-items:center;position:relative;z-index:1;padding:72px 0}'
          new_layout = '.hero-layout{display:grid;grid-template-columns:1fr;max-width:900px;gap:0;align-items:center;position:relative;z-index:1;padding:72px 0}'
          if old_layout in index:
              index = index.replace(old_layout, new_layout, 1)
              note('index: converted hero to one-column layout')
          elif new_layout not in index:
              raise RuntimeError('index: hero layout marker missing')

          if '.chain-vis{position:relative}' in index:
              index = index.replace('.chain-vis{position:relative}', '.chain-vis{display:none!important}', 1)
              note('index: removed Påverkanskedjan from visible hero')
          elif '.chain-vis{display:none!important}' not in index:
              raise RuntimeError('index: chain-vis CSS marker missing')

          org_cta = '          <a href="organisationstest.html" class="btn-ghost">Gör organisationstestet</a>\n'
          if 'href="organisationstest.html" class="btn-ghost">Gör organisationstestet</a>' not in index:
              map_cta = '          <a href="modules.html#mod-map" class="btn-ghost">Se händelsekartan</a>\n'
              if map_cta not in index:
                  raise RuntimeError('index: map CTA marker missing')
              index = index.replace(map_cta, map_cta + org_cta, 1)
              note('index: added Organisationstest as third hero button')

          # Move the visual-model card into part I next to theory/model content.
          visual_card_pat = re.compile(r'\n\s*<a href="modules\.html#mod-visuals" class="mcard"[^>]*>.*?</a>', re.S)
          cards = list(visual_card_pat.finditer(index))
          if len(cards) != 1:
              raise RuntimeError(f'index: expected one visual-model card, got {len(cards)}')
          visual_card = cards[0].group(0).strip()
          index = index[:cards[0].start()] + index[cards[0].end():]
          theory_card_pat = re.compile(r'(<a href="modules\.html#mod-theory" class="mcard"[^>]*>.*?</a>)', re.S)
          if len(theory_card_pat.findall(index)) != 1:
              raise RuntimeError('index: theory card not uniquely located')
          index = theory_card_pat.sub(r'\1\n        ' + visual_card, index, count=1)
          note('index: moved visual-model card from Agera to Förstå')

          # Surface the Botkyrka case on the front page; map record already exists as an indication.
          bot_title = 'Botkyrka — misstänkta oegentligheter granskas av infiltrationskommission'
          if bot_title not in index:
              target_title = '<div class="cp-title">Norrtäljeanstalten — kriminalvårdare smugglade mobiler till gängledare, åtta dömda</div>'
              pos = index.find(target_title)
              if pos < 0:
                  raise RuntimeError('index: case preview insertion target missing')
              astart = index.rfind('      <a href="modules.html#mod-map" class="cp-row">', 0, pos)
              if astart < 0:
                  raise RuntimeError('index: case preview anchor start missing')
              bot_row = '''      <a href="modules.html#mod-map" class="cp-row">
        <div class="cp-status ind"></div>
        <div class="cp-tcell">
          <div class="cp-title">Botkyrka — misstänkta oegentligheter granskas av infiltrationskommission</div>
          <div class="cp-meta">Botkyrka · Indikation · Kaliber 15–16 juni 2026 · Regeringen 26 juni 2026</div>
        </div>
        <div class="cp-sector">Kommun/politik</div>
        <div class="cp-year">2026</div>
      </a>
'''
              index = index[:astart] + bot_row + index[astart:]
              note('index: surfaced Botkyrka/infiltrationskommission in case preview')

          # Keep the 680 figure historically correct, but connect it to the newer MGL 2025.
          old_stat = '<div class="stat-note"><a href="https://polisen.se/siteassets/dokument/regeringsuppdrag/lagesbild-over-aktiva-gangkriminella-i-sverige-.pdf/download/?v=f8edd8d100b188a6937b44efc91a30ea" target="_blank" rel="noopener">Polismyndighetens lägesbild 2024</a> — kategoriserade som möjliggörare bland aktiva i kriminella nätverk</div>'
          new_stat = '<div class="stat-note"><a href="https://polisen.se/siteassets/dokument/regeringsuppdrag/lagesbild-over-aktiva-gangkriminella-i-sverige-.pdf/download/?v=f8edd8d100b188a6937b44efc91a30ea" target="_blank" rel="noopener">Polismyndighetens lägesbild 2024</a> — senaste publicerade kvantifieringen av just kategorin möjliggörare. <a href="https://polisen.se/siteassets/dokument/organiserad_brottslighet/myndighetsgemensam-lagesbild---organiserad-brottslighet-2025.pdf" target="_blank" rel="noopener">MGL 2025</a> beskriver den uppdaterade hotbilden för möjliggörare, korruption och otillåten påverkan.</div>'
          if old_stat in index:
              index = index.replace(old_stat, new_stat, 1)
              note('index: retained 680 as 2024-specific metric and linked current MGL 2025')

          # ---------- MODULES ----------
          modules = align_source_nav(modules, 'modules')
          modules = move_visual_nav(modules, 'modules')

          # Remove the global/repeated source catalogue. The dedicated mod-sources remains canonical.
          source_section = modules.find('<section id="mod-sources"')
          if source_section < 0:
              raise RuntimeError('modules: dedicated mod-sources section missing')
          footer_tag = modules.rfind('<footer id="kallforteckning"', 0, source_section)
          if footer_tag >= 0:
              comment_start = modules.rfind('<!--', max(0, footer_tag - 300), footer_tag)
              start = comment_start if comment_start >= 0 else footer_tag
              modules = modules[:start] + '<!-- Källkatalogen finns enbart i mod-sources. -->\n' + modules[source_section:]
              note('modules: removed repeated Primärkällor och fallreferenser footer; kept dedicated Källor module')
          elif 'Källförteckning · Reviderad augusti 2026' in modules:
              raise RuntimeError('modules: revision label remains but footer was not found')

          # Re-locate dedicated source section after footer removal.
          source_section = modules.find('<section id="mod-sources"')
          source_text = modules[source_section:]
          filter_pos_rel = source_text.find("filterSrc('all')")
          if filter_pos_rel < 0:
              raise RuntimeError('modules: source filter marker missing')

          # Remove MCF from the featured source cards.
          mcf_url = 'https://www.mcf.se/sv/amnesomraden/skydd-mot-olyckor-och-farliga-amnen/farligt-gods/transportskydd/'
          featured = source_text[:filter_pos_rel]
          mcf_card_pat = re.compile(
              r'\s*<div style="padding:16px 20px;background:var\(--bg-card\);border:1px solid var\(--border\);border-left:3px solid var\(--accent\)">\s*'
              r'<div[^>]*>Källa</div>\s*'
              r'<div[^>]*><a href="' + re.escape(mcf_url) + r'"[^>]*>MCF — Vägledning Transportskydd \(MCF0079, mars 2026\) ↗</a></div>\s*'
              r'<div[^>]*>Myndigheten för civilt försvar\..*?</div>\s*</div>', re.S)
          featured2, n_mcf = mcf_card_pat.subn('', featured, count=1)
          if n_mcf != 1:
              raise RuntimeError(f'modules: expected one featured MCF card, removed {n_mcf}')
          source_text = featured2 + source_text[filter_pos_rel:]
          modules = modules[:source_section] + source_text
          note('modules: de-featured MCF transport guidance')

          # Correct publication cadence in the organisation test explanation.
          old_hint = 'Myndighetsgemensam lägesbild om organiserad brottslighet publiceras årligen. Organisationer som inte aktivt konsumerar omvärldsbevakning saknar grundförutsättningen för adekvat riskbedömning.'
          new_hint = 'Den myndighetsgemensamma lägesbilden om organiserad brottslighet tas fram vartannat år; den senaste är MGL 2025. Den årliga rapporten Myndigheter i samverkan mot den organiserade brottsligheten redovisar det myndighetsgemensamma arbetet för föregående år. Organisationer som inte aktivt använder extern hotbildsinformation saknar en viktig grund för en aktuell riskbedömning.'
          if old_hint in modules:
              modules = modules.replace(old_hint, new_hint, 1)
              note('modules: corrected MGL cadence and pointed to MGL 2025')

          # Enrich existing Botkyrka indication with the reporting that triggered renewed scrutiny.
          if '"id":"c133"' in modules and 'socialdemokraterna-gangen-och-maktskiftet-i-botkyrka-del-1-2' not in modules:
              cstart = modules.find('"id":"c133"')
              cend = modules.find('},{"id":"c134"', cstart)
              if cend < 0:
                  raise RuntimeError('modules: c133 end marker missing')
              chunk = modules[cstart:cend]
              gov_source = '{"l":"Regeringen — infiltrationskommission mot otillåten påverkan, Dir. 2026:63 (26 juni 2026)","t":"report","url":"https://www.regeringen.se/pressmeddelanden/2026/06/regeringen-tillsatter-en-infiltrationskommission-mot-otillaten-paverkan/"}'
              if gov_source not in chunk:
                  raise RuntimeError('modules: c133 government source missing')
              extra = gov_source + ',{"l":"Sveriges Radio Kaliber — Socialdemokraterna, gängen och maktskiftet i Botkyrka, del 1/2 (15 juni 2026)","t":"media","url":"https://www.sverigesradio.se/avsnitt/socialdemokraterna-gangen-och-maktskiftet-i-botkyrka-del-1-2"},{"l":"Sveriges Radio Kaliber — Socialdemokraterna, gängen och maktskiftet i Botkyrka, del 2/2 (15 juni 2026)","t":"media","url":"https://www.sverigesradio.se/avsnitt/socialdemokraterna-gangen-och-maktskiftet-i-botkyrka-del-2-2"},{"l":"Sveriges Radio — ytterligare kriminell i S-uppgörelsen i Botkyrka 2023 (15 juni 2026)","t":"media","url":"https://www.sverigesradio.se/artikel/kaliber-avslojar-ytterligare-kriminell-i-s-uppgorelsen-i-botkyrka-2023"}'
              chunk = chunk.replace(gov_source, extra, 1)
              modules = modules[:cstart] + chunk + modules[cend:]
              note('modules: added Kaliber/SR sources to contested Botkyrka indication')

          # Build a normal source group with current 2025–2026 primary sources, adding only missing URLs.
          current_sources = [
              ('https://polisen.se/siteassets/dokument/organiserad_brottslighet/myndighetsgemensam-lagesbild---organiserad-brottslighet-2025.pdf', 'Polismyndigheten — Myndighetsgemensam lägesbild, organiserad brottslighet 2025'),
              ('https://polisen.se/8e4d12f09a3e80cc10e4416846bd947a/siteassets/dokument/organiserad_brottslighet/rapport_organiseradbrottslighet_2025.pdf', 'Polismyndigheten — Myndigheter i samverkan mot den organiserade brottsligheten 2025'),
              ('https://polisen.se/siteassets/dokument/regeringsuppdrag/regeringsuppdrag-2025-lagesbild-over-aktiva-gangkriminella-i-sverige.pdf/download/', 'Polismyndigheten — Lägesbild över aktiva gängkriminella i Sverige, regeringsuppdrag 2025'),
              ('https://polisen.se/4d2a5950d779836a69499efa161273cd/siteassets/dokument/organiserad_brottslighet/rapport_korruption-i-sverige-2025.pdf', 'Polismyndigheten — Korruption i Sverige, lägesbild 2025'),
              ('https://www.regeringen.se/pressmeddelanden/2026/06/regeringen-tillsatter-en-infiltrationskommission-mot-otillaten-paverkan/', 'Regeringen — infiltrationskommission mot otillåten påverkan, Dir. 2026:63'),
              ('https://bra.se/rapporter/arkiv/2026-05-29-stod-for-arbetet-mot-otillaten-paverkan-i-den-offentliga-forvaltningen', 'Brå/Statskontoret — Stöd för arbetet mot otillåten påverkan i den offentliga förvaltningen, slutredovisning 2026'),
          ]

          # Work only in the dedicated source module and only after the filters, so none of these become featured cards.
          source_section = modules.find('<section id="mod-sources"')
          source_text = modules[source_section:]
          filter_pos_rel = source_text.find("filterSrc('all')")
          after_filters = source_text[filter_pos_rel:]
          entries = []
          for url, label in current_sources:
              if url not in after_filters:
                  entries.append((url, label))
          # Ensure MCF is an ordinary source after the filters.
          if mcf_url not in after_filters:
              entries.append((mcf_url, 'Myndigheten för civilt försvar — Vägledning Transportskydd (MCF0079, mars 2026)'))

          if entries:
              first_group_rel = source_text.find('<div class="src-group"', filter_pos_rel)
              if first_group_rel < 0:
                  raise RuntimeError('modules: first ordinary src-group missing')
              links = []
              for url, label in entries:
                  links.append(f'''      <a href="{url}" target="_blank" rel="noopener" style="display:flex;align-items:flex-start;gap:10px;padding:7px 10px;text-decoration:none;border:1px solid transparent;border-radius:2px;transition:.15s" onmouseover="this.style.borderColor='#B8973A30';this.style.background='var(--bg-card)'" onmouseout="this.style.borderColor='transparent';this.style.background='transparent'"><span style="font-size:11px;margin-top:1px;flex-shrink:0">🏛</span><span style="font-family:var(--fm);font-size:12px;color:var(--text);line-height:1.5">{label}</span></a>''')
              group = '''  <div class="src-group" data-cat="aktuella-huvudkallor-2025-2026" style="margin-bottom:48px">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #B8973A40">
      <div style="width:3px;height:22px;background:#B8973A;flex-shrink:0"></div>
      <div><div style="font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text)">Aktuella huvudkällor 2025–2026</div><div style="font-size:11px;color:var(--muted);margin-top:2px">Senaste centrala lägesbilder, återrapporteringar och regeringsuppdrag.</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr;gap:2px">
''' + '\n'.join(links) + '''
    </div>
  </div>
'''
              source_text = source_text[:first_group_rel] + group + source_text[first_group_rel:]
              # Keep the visible all-count consistent when possible.
              def bump(m):
                  return f'Alla ({int(m.group(1)) + len(entries)})'
              source_text, ncount = re.subn(r'Alla \((\d+)\)', bump, source_text, count=1)
              if ncount != 1:
                  note('modules: warning — source total button not found for count update')
              modules = modules[:source_section] + source_text
              note(f'modules: added {len(entries)} non-featured current source entries (including MCF if missing)')
          else:
              note('modules: current 2025–2026 sources and ordinary MCF entry already present')

          # Verify the visible editorial revision label is gone.
          if 'Källförteckning · Reviderad augusti 2026' in modules:
              raise RuntimeError('modules: visible revision label still present')
          if 'Primärkällor och <em>fallreferenser</em>' in modules:
              raise RuntimeError('modules: repeated primary/fall-reference heading still present')

          index_path.write_text(index, encoding='utf-8')
          modules_path.write_text(modules, encoding='utf-8')
          Path('site-maintenance-result.txt').write_text('\n'.join(log) + '\n', encoding='utf-8')

      - name: Validate reference structure
        run: node scripts/validate-references.mjs
      - name: Commit site changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html modules.html site-maintenance-result.txt
          git commit -m "feat: simplify sources and refresh OSINT navigation" || exit 0
          git push
