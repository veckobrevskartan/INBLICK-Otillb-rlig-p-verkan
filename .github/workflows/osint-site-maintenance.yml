name: OSINT site maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/osint-site-maintenance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect current site markers
        shell: python
        run: |
          from pathlib import Path

          files = [Path('index.html'), Path('modules.html')]
          needles = [
              'Källförteckning · Reviderad augusti 2026',
              'Återkommande primärkällor',
              'Vägledning Transportskydd',
              'Myndigheter i samverkan mot den organiserade brottsligheten 2024',
              'Myndigheter i samverkan mot den organiserade brottsligheten 2025',
              'Myndighetsgemensam lägesbild',
              'Lägesbild över aktiva gängkriminella',
              'Polismyndighetens lägesbild 2024',
              'mod-sources',
              'nav-source',
              'Teorier och modeller',
              'Visuella modeller',
              'Botkyrka',
              'infiltrationskommission',
              'Statskontoret och Brå',
              'RiR 2026:3',
          ]
          out = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              out.append(f'===== {path} ({len(text)} chars) =====')
              for needle in needles:
                  out.append(f'\n--- {needle!r}: {text.count(needle)} match(es) ---')
                  start = 0
                  shown = 0
                  while shown < 10:
                      pos = text.find(needle, start)
                      if pos < 0:
                          break
                      a = max(0, pos - 500)
                      b = min(len(text), pos + len(needle) + 850)
                      out.append(text[a:b].replace('\r',''))
                      out.append('[...context end...]')
                      shown += 1
                      start = pos + len(needle)
          Path('site-maintenance-diagnostics.txt').write_text('\n'.join(out), encoding='utf-8')
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-maintenance-diagnostics.txt
          git commit -m "chore: refresh site maintenance diagnostics" || exit 0
          git push
